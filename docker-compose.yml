# Infra for MiniRide. Postgres = our database, Redis = cache/pubsub/geo.
# Why Docker: reproducible, matches how prod runs (you don't install pg locally).
services:
  postgres:
    image: postgres:16
    container_name: miniride-pg
    environment:
      POSTGRES_USER: miniride
      POSTGRES_PASSWORD: miniride
      POSTGRES_DB: miniride
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: miniride-redis
    ports:
      - "6381:6379"

volumes:
  pgdata:
